name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the scripts parse
        run: |
          node --check index.js
          node --check shared.js
          node --check options.js

      - name: Rebuild the mp3 encoder and check it matches libs/lame-wasm.js
        run: |
          bash wasm/build.sh
          git diff --exit-code libs/lame-wasm.js

      - name: Build the add-on
        run: bash build.sh
