name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the scripts parse
        run: |
          node --check index.js
          node --check shared.js
          node --check options.js

      - name: Build the add-on
        run: bash build.sh
